<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrument Designer — 3D Preview</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family: system-ui, sans-serif; background:#1a1a1a; color:#eee; }
  #toolbar { position:absolute; top:8px; left:8px; z-index:10; display:flex; gap:8px; align-items:center; background:rgba(0,0,0,.55); padding:6px 10px; border-radius:8px; }
  #toolbar select { background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:4px 6px; max-width:280px; }
  #status { position:absolute; bottom:8px; left:8px; z-index:10; font-size:12px; color:#9be; background:rgba(0,0,0,.55); padding:4px 8px; border-radius:6px; }
  #hint { position:absolute; bottom:8px; right:8px; z-index:10; font-size:11px; color:#888; background:rgba(0,0,0,.45); padding:4px 8px; border-radius:6px; }
  #error { position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:#400; color:#fcc; font-size:15px; text-align:center; padding:20px; }
</style>
</head>
<body>
<div id="toolbar">
  <label for="preset">Instrument</label>
  <select id="preset"></select>
</div>
<div id="status">Loading…</div>
<div id="hint">drag = rotate · wheel = zoom · right-drag = pan</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const params = new URLSearchParams(location.search);
const DEFAULT_PRESET = "koncovka_C";
let currentPreset = params.get("preset") || DEFAULT_PRESET;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 150, 0);

scene.add(new THREE.GridHelper(500, 20, 0x555555, 0x333333));

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(300, 400, 300);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8899ff, 0.35);
fill.position.set(-300, 100, -300);
scene.add(fill);

let mesh = null;
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const presetSelect = document.getElementById("preset");

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = "flex";
}

async function loadPreset(preset) {
  statusEl.textContent = `Loading ${preset}…`;
  errorEl.style.display = "none";
  try {
    const resp = await fetch("/export/cadquery", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ preset }),
    });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`Server error ${resp.status}: ${text.slice(0, 200)}`);
    }
    const buf = await resp.arrayBuffer();
    const geom = new STLLoader().parse(buf);
    geom.computeVertexNormals();
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    mesh = new THREE.Mesh(
      geom,
      new THREE.MeshStandardMaterial({
        color: 0xc8a86a, flatShading: true, metalness: 0.15, roughness: 0.55,
      })
    );
    scene.add(mesh);

    geom.computeBoundingBox();
    const bb = geom.boundingBox;
    const size = bb.getSize(new THREE.Vector3());
    const center = bb.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    camera.position.copy(center).add(new THREE.Vector3(maxDim * 1.3, maxDim * 0.9, maxDim * 1.3));
    controls.target.copy(center);
    controls.update();
    statusEl.textContent =
      `${preset}: ${(buf.byteLength / 1024).toFixed(1)} KB · ` +
      `${Math.round(geom.attributes.position.count / 3)} triangles`;
  } catch (err) {
    showError("Failed to load: " + err.message);
  }
}

async function initSelect() {
  try {
    const resp = await fetch("/export/cadquery/instruments");
    const data = await resp.json();
    for (const [key, meta] of Object.entries(data)) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = `${meta.display_name || key} (${key})`;
      presetSelect.appendChild(opt);
    }
    if (data[currentPreset]) presetSelect.value = currentPreset;
  } catch (err) {
    showError("Failed to list presets: " + err.message);
  }
}

presetSelect.addEventListener("change", () => {
  currentPreset = presetSelect.value;
  loadPreset(currentPreset);
  history.replaceState(null, "", "?preset=" + encodeURIComponent(currentPreset));
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

initSelect().then(() => loadPreset(currentPreset));
animate();
</script>
</body>
</html>
