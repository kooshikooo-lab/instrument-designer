[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-designer"
version = "2.0.0"
description = "GUI application for designing, simulating, and 3D-printing musical instruments"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "demakein>=1.0",
    "openwind>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pymoo>=0.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
jax = ["jax>=0.4", "jaxlib>=0.4"]
surrogate = ["jax>=0.4", "jaxlib>=0.4", "flax", "optax", "botorch", "torch"]
freecad = ["freecad"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
instrument-designer = "woodwind_designer.main:main"
woodwind-designer = "woodwind_designer.main:main"

[tool.setuptools.packages.find]
include = ["woodwind_designer*"]

[tool.pytest.ini_options]
# tests/ contains many ad-hoc scripts (module-level execution) that are not
# pytest tests. Collect only the genuine pytest files to avoid import hangs.
python_files = [
    "test_analytical_pipes.py",
    "test_architecture.py",
    "test_cadquery_instrument.py",
    "test_inverse_design.py",
    "test_openwind_solver.py",
    "test_phase2_objective.py",
    "test_properties.py",
    "test_server_routes.py",
    "test_surrogate.py",
    "test_tmm.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"
