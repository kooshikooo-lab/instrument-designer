[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-designer"
version = "2.0.0"
description = "GUI application for designing, simulating, and 3D-printing musical instruments"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "demakein>=1.0",
    "openwind>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pymoo>=0.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
jax = ["jax>=0.4", "jaxlib>=0.4"]
surrogate = ["jax>=0.4", "jaxlib>=0.4", "flax", "optax", "botorch", "torch", "gpytorch"]
cad = ["cadquery>=2.4", "cadquery-ocp", "build123d>=0.7", "vtk>=9.0", "trimesh>=4.0", "rtree>=1.0", "pillow>=9.0"]
bench = ["dask[distributed]>=2024.1", "psutil>=5.9", "cma>=3.0"]
perf = ["numba>=0.60"]
spectral = ["librosa>=0.10"]
fem = ["gmsh>=4.12", "meshio>=5.3", "scikit-fem>=8.0"]
freecad = ["freecad"]
chess = ["chess>=1.10"]
test = ["pytest>=7.0", "jsonschema>=4.0"]
dev = ["pytest>=7.0", "ruff>=0.1", "jsonschema>=4.0"]

[project.scripts]
instrument-designer = "woodwind_designer.main:main"
woodwind-designer = "woodwind_designer.main:main"

[tool.setuptools.packages.find]
include = ["woodwind_designer*"]

[tool.pytest.ini_options]
# tests/ contains many ad-hoc scripts (module-level execution) that are not
# pytest tests. Collect only the genuine pytest files to avoid import hangs.
python_files = [
    "test_analytical_pipes.py",
    "test_architecture.py",
    "test_blender_addon_import.py",
    "test_blender_server_client.py",
    "test_bore_design.py",
    "test_cadquery_instrument.py",
    "test_compare_recording.py",
    "test_inverse_design.py",
    "test_local_llm.py",
    "test_metrics.py",
    "test_openwind_solver.py",
    "test_phase2_objective.py",
    "test_properties.py",
    "test_scan_to_bore.py",
    "test_server_routes.py",
    "test_stl_export.py",
    "test_stl_render_compare.py",
    "test_stl_watertight.py",
    "test_folded_export.py",
    "test_surrogate.py",
    "test_tmm.py",
    "test_tool_registry.py",
    "test_whitelist.py",
    "test_topk_polish.py",
    "test_dask_topk.py",
    "test_mesh_repair_gate.py",
    "test_benchmark_all.py",
    "test_metamaterial.py",
    "test_metamaterial_fem_crosscheck.py",
    "test_metamaterial_graded.py",
    "test_metamaterial_intonation.py",
    "test_metamaterial_low_clarinets.py",
    "test_metamaterial_register_suppression.py",
    "test_metamaterial_stl_export.py",
    "test_metamaterial_subcontrabass.py",
    "test_guard_scripts.py",
    "test_fusion_360.py",
    "test_validate_imports.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"
