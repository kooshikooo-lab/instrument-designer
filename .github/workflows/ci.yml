name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check backend/ woodwind_designer/ --select E,F,W --ignore E501

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-glx libxkbcommon-x11-0
      - name: Run tests
        run: xvfb-run pytest tests/ backend/tests/ --shard=${{ matrix.shard }}/4 -v --tb=short
