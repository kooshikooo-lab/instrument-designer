name: governance-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Block unauthorized governance file edits and unmarked provisional work
        run: |
          python scripts/validate_commit_msg.py
      - name: Check local dependencies are present for imported declared packages
        run: |
          python scripts/check_local_dependencies.py --warn
